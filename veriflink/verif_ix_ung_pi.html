<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses CBT Kelas IX Unggulan PI</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }

        /* Effek Glassmorphism untuk Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Animasi Shake saat Password Salah */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        /* Styling Badge Ikon Utama */
        .icon-badge {
            width: 70px;
            height: 70px;
            font-size: 1.8rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        /* Transisi Smooth untuk Form Input & Button */
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
            border-color: #6366f1;
        }

        .btn-indigo {
            background-color: #4f46e5;
            color: #ffffff;
            transition: all 0.2s ease-in-out;
        }

        .btn-indigo:hover {
            background-color: #4338ca;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-indigo:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3 select-none">

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                
                <!-- Main Protection Card -->
                <div id="passwordCard" class="card glass-card shadow-lg border-0 rounded-4 p-4 p-sm-5 my-4">
                    
                    <!-- Header Icon & Titles -->
                    <div class="text-center mb-4">
                        <div id="iconBadge" class="icon-badge bg-primary-subtle text-primary mb-3">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h2 class="fw-bold text-dark mb-1 h4">Akses Terproteksi</h2>
                        <p class="text-muted small">Silakan masukkan kata sandi untuk membuka CBT Kelas IX Unggulan PI</p>
                    </div>

                    <!-- Bootstrap Alert Error -->
                    <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none d-flex align-items-center rounded-3 p-3 mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill fs-5 me-2 flex-shrink-0"></i>
                        <div class="small">
                            Kata sandi salah! Silakan periksa dan coba lagi.
                        </div>
                    </div>

                    <!-- Bootstrap Alert Sukses -->
                    <div id="successAlert" class="alert alert-success alert-dismissible fade show d-none d-flex align-items-center rounded-3 p-3 mb-4" role="alert">
                        <i class="bi bi-check-circle-fill fs-5 me-2 flex-shrink-0"></i>
                        <div class="small">
                            Kata sandi benar! Membuka akses CBT ...
                        </div>
                    </div>

                    <!-- Form Password -->
                    <form id="passwordForm" onsubmit="handleFormSubmit(event)" class="needs-validation" novalidate autocomplete="off">
                        <div class="mb-4">
                            <label for="passwordInput" class="form-label text-uppercase fw-semibold text-secondary small tracking-wide">
                                Kata Sandi
                            </label>
                            
                            <!-- Input Group dengan Toggle Eye Icon -->
                            <div class="input-group">
                                <input 
                                    type="password" 
                                    class="form-control form-control-lg fs-6 py-2.5 px-3" 
                                    id="passwordInput" 
                                    placeholder="Masukkan kata sandi..." 
                                    required
                                >
                                <button 
                                    class="btn btn-outline-secondary px-3" 
                                    type="button" 
                                    id="togglePasswordBtn"
                                    onclick="togglePasswordVisibility()"
                                    title="Tampilkan / Sembunyikan Password"
                                >
                                    <i id="eyeIcon" class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Tombol Submit -->
                        <button type="submit" id="submitBtn" class="btn btn-indigo btn-lg w-full w-100 py-2.5 fw-semibold fs-6 rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                            <span id="btnText">Login CBT</span>
                            <i id="btnIcon" class="bi bi-arrow-right-short fs-5"></i>
                        </button>
                    </form>

                    <!-- Card Footer -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <small class="text-muted opacity-75">
                            <i class="bi bi-lock me-1"></i> Sistem Keamanan Terenkripsi </i>
                            Dibuat Oleh Tim Unggulan MTs
                        </small>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle (Includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // =========================================================================
        // =========================================================================
        const iwankece = "UNG269PI";               
        const TARGET_URL       = "https://forms.gle/uk83QXE6LRReJ3wh8";  
        const REDIRECT_DELAY   = 1500;                      
        // =========================================================================

        // Referensi Elemen DOM
        const passwordForm = document.getElementById('passwordForm');
        const passwordInput = document.getElementById('passwordInput');
        const passwordCard = document.getElementById('passwordCard');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const iconBadge = document.getElementById('iconBadge');

        /**
         * Fitur untuk beralih tipe input password (Tampilkan / Sembunyikan)
         */
        function togglePasswordVisibility() {
            const isPasswordType = passwordInput.getAttribute('type') === 'password';
            
            if (isPasswordType) {
                passwordInput.setAttribute('type', 'text');
                eyeIcon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                passwordInput.setAttribute('type', 'password');
                eyeIcon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        /**
         * Mengelola event pengiriman form
         */
        function handleFormSubmit(event) {
            event.preventDefault(); // Mencegah submit halaman biasa

            const enteredPassword = passwordInput.value.trim();

            // Sembunyikan pesan alert yang ada sebelumnya
            resetAlerts();

            // Validasi Password
            if (enteredPassword === iwankece) {
                processSuccessState();
            } else {
                processErrorState();
            }
        }

        /**
         * Tampilan saat password SALAH
         */
        function processErrorState() {
            // Tampilkan Bootstrap Alert Error
            errorAlert.classList.remove('d-none');

            // Tambahkan border merah pada input
            passwordInput.classList.add('is-invalid');

            // Jalankan animasi Shake pada Card
            passwordCard.classList.add('shake-animation');

            // Hapus kelas animasi setelah animasi selesai agar dapat diulang
            setTimeout(() => {
                passwordCard.classList.remove('shake-animation');
            }, 400);

            // Sorot kembali teks input password
            passwordInput.focus();
            passwordInput.select();
        }

        /**
         * Tampilan saat password BENAR
         */
        function processSuccessState() {
            // Tampilkan Alert Sukses
            successAlert.classList.remove('d-none');

            // Beri tanda sukses pada input & disable input
            passwordInput.classList.add('is-valid');
            passwordInput.disabled = true;
            togglePasswordBtn.disabled = true;

            // Ubah badge ikon atas menjadi sukses
            iconBadge.classList.replace('bg-primary-subtle', 'bg-success-subtle');
            iconBadge.classList.replace('text-primary', 'text-success');
            iconBadge.innerHTML = '<i class="bi bi-shield-check"></i>';

            // Ubah status tombol menjadi Loading
            submitBtn.disabled = true;
            submitBtn.classList.replace('btn-indigo', 'btn-success');
            btnText.textContent = "Mengalihkan...";
            btnIcon.className = "spinner-border spinner-border-sm";

            // Eksekusi Pengalihan (Redirect) setelah delay
            setTimeout(() => {
                window.location.href = TARGET_URL;
            }, REDIRECT_DELAY);
        }

        /**
         * Reset alert dan status validasi input
         */
        function resetAlerts() {
            errorAlert.classList.add('d-none');
            successAlert.classList.add('d-none');
            passwordInput.classList.remove('is-invalid', 'is-valid');
        }

        // Reset indikator error ketika user mulai mengetik kembali
        passwordInput.addEventListener('input', () => {
            if (!errorAlert.classList.contains('d-none')) {
                resetAlerts();
            }
        });
    </script>
</body>
</html>
