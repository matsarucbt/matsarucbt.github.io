    <style>
        :root {
            --brand-primary: #6366f1;
            --brand-secondary: #ec4899;
            --brand-accent: #06b6d4;
            --bg-dark: #090d16;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(6, 182, 212, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Glassmorphism Card Effect */
        .glass-container {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.125);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* SVG Keyframe Animations */
        @keyframes spin-clockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spin-counterwise {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes float-gentle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .gear-main {
            transform-origin: 200px 180px;
            animation: spin-clockwise 16s linear infinite;
        }

        .gear-secondary {
            transform-origin: 275px 130px;
            animation: spin-counterwise 10s linear infinite;
        }

        .gear-tertiary {
            transform-origin: 130px 220px;
            animation: spin-counterwise 12s linear infinite;
        }

        .rocket-element {
            animation: float-gentle 4s ease-in-out infinite;
        }

        .sparkle-element {
            animation: pulse-glow 2.5s ease-in-out infinite;
        }

        /* Badge Glow Style */
        .badge-dev {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #818cf8;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Custom Progress Bar Glow */
        .progress-glow {
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: 14px;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar-custom {
            background: linear-gradient(90deg, #6366f1 0%, #ec4899 50%, #06b6d4 100%);
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Interactive Buttons & Inputs */
        .form-control-custom {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            background: rgba(15, 23, 42, 0.95);
            border-color: #818cf8;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
            color: #ffffff;
        }

        .btn-brand {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-brand:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-brand:active {
            transform: translateY(0);
        }

        .btn-outline-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            transition: all 0.3s ease;
        }

        .btn-outline-glass:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Status Pills Feature Cards */
        .feature-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 16px;
            transition: background 0.3s ease;
        }

        .feature-pill:hover {
            background: rgba(255, 255, 255, 0.06);
        }

    <!-- Bootstrap Toast Notification Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;">
        <div id="statusToast" class="toast align-items-center text-bg-dark border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i id="toastIcon" class="bi bi-check-circle-fill text-success fs-5"></i>
                    <span id="toastMessage" class="small">Email Anda berhasil didaftarkan!</span>
                </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Target progres persentase pengerjaan fitur
        const TARGET_PROGRESS = 75;

        // Inisialisasi saat DOM dimuat
        document.addEventListener('DOMContentLoaded', () => {
            animateProgressBar();
        });

        /**
         * Animasi pengisian progress bar saat halaman pertama dibuka
         */
        function animateProgressBar() {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            setTimeout(() => {
                progressBar.style.width = TARGET_PROGRESS + '%';
            }, 300);
        }

        /**
         * Menangani submit form pendaftaran email notifikasi
         */
        function handleSubscribe(event) {
            event.preventDefault();
            
            const emailInput = document.getElementById('emailInput');
            const emailValue = emailInput.value.trim();
            const notifyBtn = document.getElementById('notifyBtn');
            const notifyBtnText = document.getElementById('notifyBtnText');
            const notifyBtnIcon = document.getElementById('notifyBtnIcon');

            // Validasi format email sederhana
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailValue || !emailPattern.test(emailValue)) {
                // Tampilkan Toast Error
                showToast('Harap masukkan alamat email yang valid!', 'error');
                emailInput.focus();
                return;
            }

            // Tampilan Loading pada tombol
            notifyBtn.disabled = true;
            notifyBtnText.textContent = "Memproses...";
            notifyBtnIcon.className = "spinner-border spinner-border-sm";

            // Simulasi API call / pengiriman data
            setTimeout(() => {
                // Reset tombol
                notifyBtn.disabled = false;
                notifyBtnText.textContent = "Tergabung!";
                notifyBtnIcon.className = "bi bi-check-lg";
                
                // Reset input
                emailInput.value = "";

                // Tampilkan Notifikasi Toast Sukses
                showToast('Terima kasih! Kami akan memberi tahu Anda begitu fitur rilis.', 'success');

                // Kembalikan tombol ke keadaan semula setelah 3 detik
                setTimeout(() => {
                    notifyBtnText.textContent = "Beri Tahu Saya";
                    notifyBtnIcon.className = "bi bi-bell-fill fs-6";
                }, 3000);

            }, 1200);
        }

        /**
         * Menampilkan Bootstrap Toast Notifikasi kustom
         */
        function showToast(message, type = 'success') {
            const toastEl = document.getElementById('statusToast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;

            if (type === 'success') {
                toastIcon.className = 'bi bi-check-circle-fill text-success fs-5';
            } else {
                toastIcon.className = 'bi bi-exclamation-triangle-fill text-warning fs-5';
            }

            const toast = new bootstrap.Toast(toastEl, { delay: 4000 });
            toast.show();
        }

        /**
         * Fungsi Tombol Kembali ke Beranda
         */
        function goBack() {
            // Cek jika ada riwayat histori browser
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback jika dibuka langsung di tab baru
                window.location.href = '#';
                showToast('Navigasi kembali ke halaman utama...', 'success');
            }
        }

        /**
         * Modal Bantuan opsional
         */
        function showHelpModal(e) {
            e.preventDefault();
            showToast('Layanan bantuan dapat dihubungi melalui support@domain.com', 'success');
        }
    </script>
